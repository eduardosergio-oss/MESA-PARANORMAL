<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa Paranormal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0b0a0f;--pn:#14121b;--pn2:#1d1a28;--bd:#2f2a3f;--tx:#ece7dc;--mt:#8d869f;--ac:#c4253a;--gd:#d6b36a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#ece8f2;--pn:#fbf9fd;--pn2:#f0ecf6;--bd:#cfc7de;--tx:#1b1724;--mt:#645d78;--ac:#b01d31;--gd:#8a6a1f;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:'Special Elite','Courier New',monospace;font-weight:400;margin:0}
h1{font-size:22px;letter-spacing:.5px}h1 b{color:var(--ac);font-weight:400}
h2{font-size:15px;color:var(--gd);margin-bottom:8px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--bd)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:10px;padding:10px}
@media(max-width:1000px){.app{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:12px}
label{display:block;color:var(--mt);font-size:12px;margin:8px 0 3px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
input[type=range]{padding:0;accent-color:var(--ac)}input[type=color]{padding:1px;height:30px}
button{cursor:pointer;width:auto}button:hover{border-color:var(--gd)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tk:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.on{border-color:var(--gd);color:var(--gd)}
.item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.item.sel{border-color:var(--gd);background:var(--pn2)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
#table:fullscreen{height:100vh;border:0;border-radius:0}
#table{position:relative;height:88vh;min-height:560px;border-radius:10px;overflow:hidden;border:3px solid #24150b;touch-action:none;cursor:grab;background:radial-gradient(ellipse at center,#0000 40%,#000b 100%),repeating-linear-gradient(90deg,#5a3820 0 7px,#4d2f1a 7px 15px,#573721 15px 19px,#46291a 19px 30px)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#stage{position:relative;width:1000px;aspect-ratio:16/10;overflow:hidden;background:#1a1822;border:8px solid #e6dbc0;box-shadow:0 22px 50px #000d,0 3px 0 #b9ad90;touch-action:none}
#zoomctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:30}
#zoomctl button{background:#140d08cc;border-color:#6b4a2c;color:#f1e6cf;min-width:36px}
#toast{position:absolute;left:50%;top:50%;text-align:center;pointer-events:none;opacity:0;z-index:20;transform:translate(-50%,-50%)}
#toast.show{animation:roll 1.9s ease-out}
#tl{color:#fff;text-shadow:0 1px 5px #000}
@keyframes roll{0%{opacity:0;transform:translate(-50%,-50%) rotate(-300deg) scale(.3)}14%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1.15)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#grid,#dark,#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dark{background:#050818;opacity:0}
.tk{position:absolute;transform:translate(-50%,-84px);width:64px;cursor:grab;text-align:center;z-index:5;user-select:none;-webkit-user-select:none}
.st{position:relative;height:92px;transition:transform .12s}
.st svg,.st img{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);height:82px;max-width:64px;object-fit:contain;filter:drop-shadow(0 3px 2px #000a);pointer-events:none}
.base{position:absolute;left:8px;right:8px;bottom:0;height:16px;border-radius:50%;border:2px solid #000a;box-shadow:0 4px 7px #000b;background-image:radial-gradient(ellipse at 40% 30%,#fff5,#0000 70%)}
.tk.sel .base{box-shadow:0 0 0 2px var(--gd),0 0 14px var(--gd)}
.tk.drag .st{transform:translateY(-10px) scale(1.1)}
.tk.drag{cursor:grabbing;z-index:9}
.tk .c{transition:transform .12s,box-shadow .12s}
.tk.drag .c{transform:translateY(-9px) scale(1.12);box-shadow:0 18px 16px #000b}
.tk .c{width:44px;height:44px;margin:auto;border-radius:50%;border:3px solid #0008;box-shadow:0 2px 8px #000a;display:grid;place-items:center;font:20px 'Special Elite',monospace;color:#fff;text-shadow:0 1px 3px #000;background-size:cover}
.tk.sel .c{border-color:var(--gd);box-shadow:0 0 0 2px var(--gd),0 0 14px var(--gd)}
.tk.monstro .c{border-radius:8px}.tk.npc .c{border-radius:50% 50% 8px 8px}
.tk .n{font-size:11px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap;margin-top:2px}
.tk .b{height:4px;background:#0009;border-radius:2px;margin-top:1px;overflow:hidden}.tk .b i{display:block;height:100%;background:#d83a4e}
#log{max-height:170px;overflow:auto;font-size:13px}#log div{padding:3px 0;border-bottom:1px solid var(--bd)}
#log b{color:var(--gd)}
.empty{color:var(--mt);font-size:13px}
.zn{position:absolute;z-index:200;background:#000;opacity:1;transition:opacity 1s ease;cursor:pointer;display:grid;place-items:center}
#stage:not(.pl) .zn{opacity:.6}
.zn.open{opacity:0!important;pointer-events:none}
.zn span{color:var(--gd);font:13px 'Special Elite',monospace;text-align:center;padding:4px}
#stage.pl .zn span{display:none}
.door{position:absolute;z-index:210;transform:translate(-50%,-50%);background:#9b6a35;border:2px solid #2a170a;border-radius:2px;cursor:pointer;box-shadow:0 0 0 2px #0006;transition:width .4s,height .4s,background .4s}
.door.h{width:46px;height:13px}.door.v{width:13px;height:46px}
.door::after{content:'';position:absolute;inset:-9px}
.door.open{background:#6fd08c33;border:2px dashed #6fd08c}
.roof{position:absolute;z-index:3;border:2px dashed #7fb4ff88;background:#7fb4ff14;pointer-events:none}
#stage.pl .roof{display:none}
.pvz{position:absolute;z-index:220;border:2px dashed var(--gd);background:#0007;pointer-events:none}
@media(prefers-reduced-motion:reduce){#fx{display:none}.zn{transition:none}}
</style>
</head>
<body>
<header><h1>Mesa <b>Paranormal</b></h1><div class="row" style="flex:none"><button id="reset" class="gm">Limpar mesa</button></div></header>
<div class="app">
<div class="col">
  <div class="box gm"><h2>Mapa</h2>
    <label for="up">Enviar imagem do mapa</label><input type="file" id="up" accept="image/*">
    <label for="pre">Ou escolher um fundo</label>
    <select id="pre"><option value="">Escolhaâ€¦</option><option value="#1a1822">Escuro liso</option><option value="linear-gradient(135deg,#2b2f2a,#10130f)">Floresta</option><option value="linear-gradient(135deg,#3a3a40,#17171b)">Concreto</option><option value="linear-gradient(135deg,#3b1a1e,#120709)">Sangue seco</option><option value="radial-gradient(circle,#233048,#0a0d16)">PorÃ£o Ãºmido</option></select>
    <label for="gs">Tamanho da grade</label><input type="range" id="gs" min="20" max="120" value="60">
    <div class="row" style="margin-top:8px"><button id="gt" class="on">Grade ligada</button><button id="gc">Remover mapa</button></div>
  </div>
  <div class="box gm"><h2>Clima</h2>
    <div class="g3" id="wx"></div>
    <label for="wi">Intensidade</label><input type="range" id="wi" min="0" max="100" value="60">
    <label for="wd">EscuridÃ£o</label><input type="range" id="wd" min="0" max="90" value="0">
  </div>
  <div class='box gm'><h2>EscuridÃ£o e portas</h2><div class='row' style='margin-top:8px'><button id='vw'>VisÃ£o do mestre</button></div><div class='row' style='margin-top:8px'><button data-tool='zone'>Escurecer</button><button data-tool='door'>Porta</button><button data-tool='roof'>Telhado</button><button data-tool='del'>Apagar</button></div><div class='row' style='margin-top:8px'><button id='za'>Abrir tudo</button><button id='zc'>Fechar tudo</button><button id='rc'>Limpar telhados</button></div><div class='empty' id='th' style='margin-top:8px'>Clique numa Ã¡rea escura ou numa porta para abrir.</div></div>
  <div class="box"><h2>Personagens</h2>
    <button id="meu" class="pri plo" style="width:100%">Criar meu personagem</button><div class="g3 gm"><button data-add="pj" class="pri">+ Agente</button><button data-add="npc">+ NPC</button><button data-add="monstro">+ Criatura</button></div>
    <select id="bs" class="gm" style="margin-top:8px"><option value="">BestiÃ¡rio (fichas prontas)â€¦</option></select><div id="list" style="margin-top:8px"></div>
  </div>
</div>
<div class="col"><div id="table"><div id="world"><div id="stage"><div id="grid"></div><div id="dark"></div><canvas id="fx"></canvas></div></div><div id="toast"></div><div id="zoomctl"><button id="zo" title="Afastar">âˆ’</button><button id="zi" title="Aproximar">+</button><button id="zf">Ajustar</button><button id="zs">Tela cheia</button></div></div>
<div class="box empty" id="tip">Arraste a mesa para mover a vista e use a roda do mouse para zoom. Arraste as peÃ§as sobre o mapa e clique numa delas para editar a ficha.</div></div>
<div class="col">
  <div class="box" id="ed"></div>
  <div class="box"><h2>Dados</h2>
    <div class="row"><button data-d="4">d4</button><button data-d="6">d6</button><button data-d="8">d8</button><button data-d="10">d10</button><button data-d="12">d12</button><button data-d="20">d20</button><button data-d="100">d100</button></div>
    <label for="pb">PerÃ­cia (bÃ´nus do teste)</label>
    <select id="pb"><option value="0">Destreinado +0</option><option value="5">Treinado +5</option><option value="10">Veterano +10</option><option value="15">Expert +15</option></select>
    <div class="g5" id="at" style="margin-top:8px"></div>
    <div id="log" style="margin-top:8px"></div>
  </div>
</div>
</div>
<script>
const $=id=>document.getElementById(id),AT=['AGI','FOR','INT','PRE','VIG'],COL=['#c4253a','#3b7dd8','#3fa66b','#d6b36a','#8a5cd0','#d8742f'];
const WX=[['limpo','Limpo'],['chuva','Chuva'],['tempestade','Tempestade'],['neve','Neve'],['neblina','Neblina'],['sol','Sol forte']];
let S={map:'',grid:60,showGrid:true,wx:'limpo',wi:60,dk:0,sel:null,t:[]};
try{const r=localStorage.getItem('mesa-op');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('mesa-op',JSON.stringify(S))}catch(e){}if(window.sync)sync()};
const stage=$('stage'),get=id=>S.t.find(t=>t.id===id);
function mapBg(){const v=S.map;stage.style.background=!v?'#1a1822':v.startsWith('data:')?`url(${v}) center/cover no-repeat`:v}
function gridBg(){const g=$('grid');g.style.display=S.showGrid?'block':'none';g.style.backgroundImage='linear-gradient(#ffffff26 1px,transparent 1px),linear-gradient(90deg,#ffffff26 1px,transparent 1px)';g.style.backgroundSize=S.grid+'px '+S.grid+'px'}
function fig(ty,c){const O='stroke="#000b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
 if(ty==='monstro')return `<svg viewBox="0 0 60 90" ${O}><path d="M13 86L17 64Q6 50 15 34Q23 20 40 24Q55 30 50 52L46 64L51 86L40 86L36 70L26 70L22 86Z" fill="#1b1520"/><path d="M40 24Q52 8 57 17Q50 19 46 31ZM20 30Q9 12 4 21Q11 23 18 35Z" fill="${c}"/><path d="M14 40L1 62L7 67L18 52ZM48 40L59 64L53 69L44 52Z" fill="#1b1520"/><path d="M24 46Q32 54 40 46" fill="none" stroke="${c}"/><circle cx="26" cy="37" r="3" fill="#ffdf6b"/><circle cx="38" cy="37" r="3" fill="#ffdf6b"/></svg>`;
 if(ty==='npc')return `<svg viewBox="0 0 60 90" ${O}><path d="M22 70L21 86L29 86L30 70L31 86L39 86L38 70Z" fill="#23202c"/><path d="M17 30Q30 24 43 30L47 78L13 78Z" fill="${c}"/><path d="M16 32L9 56L14 58L19 42ZM44 32L51 56L46 58L41 42Z" fill="${c}"/><circle cx="30" cy="18" r="9" fill="#e3c3a1"/><path d="M18 14H42L38 6Q30 2 22 6Z" fill="#3a3340"/></svg>`;
 return `<svg viewBox="0 0 60 90" ${O}><path d="M22 58L20 86L29 86L30 62L31 86L40 86L38 58Z" fill="#23202c"/><path d="M18 30Q30 24 42 30L44 62L16 62Z" fill="${c}"/><path d="M16 32L9 56L14 58L19 42ZM44 32L51 56L46 58L41 42Z" fill="${c}"/><path d="M30 30L30 62" fill="none"/><circle cx="30" cy="18" r="9" fill="#e3c3a1"/><path d="M21 17Q30 3 39 17Q30 11 21 17Z" fill="#2a2330"/></svg>`}
function tokens(){stage.querySelectorAll('.tk').forEach(e=>e.remove());S.t.forEach(t=>{const e=document.createElement('div');e.className='tk '+t.type+(S.sel===t.id?' sel':'');e.dataset.id=t.id;e.tabIndex=0;e.style.zIndex=5+Math.round(t.y);e.style.left=t.x+'%';e.style.top=t.y+'%';
 e.innerHTML=`<div class="st"><div class="base" style="background-color:${t.color}"></div>${t.img?`<img src="${t.img}" alt="">`:fig(t.type,t.color)}</div><div class="n"></div><div class="b"><i style="width:${Math.max(0,Math.min(100,t.pv/(t.pvMax||1)*100))}%"></i></div>`;e.querySelector('.n').textContent=t.name;stage.appendChild(e)})}
function list(){const l=$('list');l.innerHTML=S.t.length?'':'<div class="empty">Nenhuma peÃ§a na mesa. Adicione um agente ou criatura.</div>';S.t.forEach(t=>{const d=document.createElement('div');d.className='item'+(S.sel===t.id?' sel':'');d.innerHTML=`<span class="dot" style="background:${t.color}"></span><span style="flex:1"></span><small style="color:var(--mt)">${t.pv}/${t.pvMax}</small>`;d.children[1].textContent=t.name;d.onclick=()=>select(t.id);l.appendChild(d)})}
function editor(){const t=get(S.sel),e=$('ed');if(!t){e.innerHTML='<h2>Ficha</h2><div class="empty">Selecione uma peÃ§a para editar nome, atributos, vida e sanidade.</div>';atr();return}
 const n=(k,v,x='')=>`<input type="number" data-k="${k}" value="${v}" ${x}>`;
 e.innerHTML=`<h2>Ficha</h2><label>Nome</label><input data-k="name" value="" id="nm">
 <div class="g2"><div><label>Tipo</label><select data-k="type"><option value="pj">Agente</option><option value="npc">NPC</option><option value="monstro">Criatura</option></select></div><div><label>Cor</label><input type="color" data-k="color" value="${t.color}"></div></div>
 <div class="g2"><div><label>NEX %</label>${n('nex',t.nex,'step=5 min=0 max=99')}</div><div><label>Imagem em pÃ© (PNG sem fundo)</label><input type="file" id="ti" accept="image/*"></div></div>
 <div class="g3"><div><label>PV</label>${n('pv',t.pv)}</div><div><label>PE</label>${n('pe',t.pe)}</div><div><label>SAN</label>${n('san',t.san)}</div>
 <div><label>PV mÃ¡x</label>${n('pvMax',t.pvMax)}</div><div><label>PE mÃ¡x</label>${n('peMax',t.peMax)}</div><div><label>SAN mÃ¡x</label>${n('sanMax',t.sanMax)}</div></div>
 <label>Atributos</label><div class="g5">${AT.map(a=>`<div><small style="color:var(--mt)">${a}</small>${n('at.'+a,t.at[a],'min=0 max=5')}</div>`).join('')}</div>
 <label>Lanterna (revela o escuro)</label><select data-k="lamp"><option value="0">Desligada</option><option value="90">Curta</option><option value="150">MÃ©dia</option><option value="230">Longa</option></select><label>AnotaÃ§Ãµes</label><textarea data-k="note" rows="3"></textarea>
 <div class="row" style="margin-top:8px"><button id="del">Remover peÃ§a</button></div>`;
 $('nm').value=t.name;e.querySelector('[data-k=type]').value=t.type;e.querySelector('[data-k=lamp]').value=t.lamp||0;e.querySelector('[data-k=note]').value=t.note||'';
 $('del').onclick=()=>{S.t=S.t.filter(x=>x!==t);S.sel=null;all()};
 $('ti').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{t.img=r.result;save();tokens();tokImgs()};r.readAsDataURL(f)};atr()}
function tokImgs(){S.t.forEach(t=>{if(t.img){const c=stage.querySelector(`[data-id="${t.id}"] .c`);if(c){c.style.backgroundImage=`url(${t.img})`;c.textContent=''}}})}
function atr(){const t=get(S.sel);$('at').innerHTML=t?AT.map(a=>`<button data-a="${a}" title="Testar ${a}">${a} ${t.at[a]}</button>`).join(''):'<div class="empty" style="grid-column:1/-1">Selecione uma peÃ§a para testar atributos.</div>'}
function all(){mapBg();gridBg();tokens();tokImgs();zones();list();editor();save()}
function select(id){S.sel=id;all()}
function add(type){const id='t'+Date.now();const m=type==='monstro';S.t.push({id,type,name:m?'Criatura':type==='npc'?'NPC':'Agente',x:50,y:50,color:m?'#8a1c28':COL[S.t.length%COL.length],nex:5,pv:m?30:16,pvMax:m?30:16,pe:6,peMax:6,san:m?0:20,sanMax:m?0:20,at:{AGI:1,FOR:1,INT:1,PRE:1,VIG:1},note:''});select(id)}
function logLine(h){const d=document.createElement('div');d.innerHTML=h;$('log').prepend(d)}
const d=n=>1+Math.floor(Math.random()*n);
function teste(a){const t=get(S.sel),v=t.at[a],b=+$('pb').value;let r=[],q;if(v<=0){r=[d(20),d(20)];q=Math.min(...r)}else{r=Array.from({length:v},()=>d(20));q=Math.max(...r)}
 const nat=q===20?' Â· crÃ­tico!':q===1?' Â· falha crÃ­tica':'';logLine(`<b></b> ${a}: [${r.join(', ')}] â†’ ${q}${b?' +'+b:''} = <b>${q+b}</b>${nat}`);$('log').firstChild.firstChild.textContent=t.name;toast(q+b,t.name+' Â· '+a)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.add)add(b.dataset.add);else if(b.dataset.a)teste(b.dataset.a);
 else if(b.dataset.d){const n=+b.dataset.d,r=d(n);logLine(`d${n}: <b>${r}</b>`);toast(r,'d'+n)}});
$('ed').addEventListener('input',e=>{const t=get(S.sel),k=e.target.dataset.k;if(!t||!k)return;let v=e.target.value;
 if(k.startsWith('at.'))t.at[k.slice(3)]=Math.max(0,+v||0);else if(['nex','pv','pe','san','pvMax','peMax','sanMax','lamp'].includes(k))t[k]=+v||0;else t[k]=v;
 tokens();tokImgs();list();atr();lamp();save()});
$('up').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.map=r.result;all()};r.readAsDataURL(f)};
$('pre').onchange=e=>{if(e.target.value){S.map=e.target.value;all()}};
$('gc').onclick=()=>{S.map='';all()};
$('gs').oninput=e=>{S.grid=+e.target.value;gridBg();save()};
$('gt').onclick=()=>{S.showGrid=!S.showGrid;$('gt').textContent=S.showGrid?'Grade ligada':'Grade desligada';$('gt').classList.toggle('on',S.showGrid);gridBg();save()};
$('wi').oninput=e=>{S.wi=+e.target.value;save()};
$('wd').oninput=e=>{S.dk=+e.target.value;$('dark').style.opacity=S.dk/100;save()};
$('reset').onclick=()=>{if(confirm('Remover todas as peÃ§as e o mapa?')){S.t=[];S.z=[];S.dr=[];S.roof=[];S.sel=null;S.map='';all()}};
$('wx').innerHTML=WX.map(([k,n])=>`<button data-w="${k}">${n}</button>`).join('');
$('wx').onclick=e=>{const k=e.target.dataset.w;if(k){S.wx=k;wxBtn();save()}};
function wxBtn(){$('wx').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.w===S.wx))}
/* arrastar peÃ§as */
stage.addEventListener('pointerdown',e=>{const el=e.target.closest('.tk');if(!el)return;e.preventDefault();const id=el.dataset.id;S.sel=id;list();editor();stage.querySelectorAll('.tk').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));
 const t=get(id);if(!can(t))return;el.classList.add('drag');el.setPointerCapture(e.pointerId);
 const mv=ev=>{const r=stage.getBoundingClientRect();t.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));t.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));el.style.left=t.x+'%';el.style.top=t.y+'%';lamp()};
 const up=()=>{el.classList.remove('drag');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);save()};
